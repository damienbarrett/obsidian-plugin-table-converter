name: Feature Request
description: Suggest an idea for improvement
title: "[Feature] "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the feature
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Why would this be useful?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: How would the feature be used?
    validations:
      required: false
